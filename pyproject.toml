[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-fraud-risk-engine"
version = "0.1.0"
description = "Real-time, explainable transaction fraud risk scoring API built around the PaySim dataset."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Safwan Chowdhury" }]
keywords = ["fraud-detection", "risk-scoring", "fastapi", "paysim", "explainable-ai", "fintech"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
]
# Runtime deps are deliberately small: the serving path is pure Python
# (no numpy/pandas/sklearn), which keeps the image slim and latency predictable.
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
# Shared velocity state for multi-replica deployments (FRE_VELOCITY_BACKEND=redis).
redis = [
  "redis>=5.0",
]
train = [
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
]
dev = [
  "realtime-fraud-risk-engine[train,redis]",
  "fakeredis>=2.20",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
fraud-engine-train = "fraud_engine.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fraud_engine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: end-to-end tests that train a model on synthetic data"]

[tool.coverage.run]
source = ["fraud_engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["N815", "N803", "N806"]  # PaySim uses camelCase column names

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
files = ["src"]
