name: CD

# Branch flow:  v1 (integration)  ->  staging  ->  prod
#
#   push to staging -> CI gate -> image ghcr.io/<owner>/realtime-fraud-risk-engine:staging -> deploy "staging"
#   push to prod    -> CI gate -> image :prod, :latest, :v<version> -> deploy "production" -> GitHub release
#
# Deploy target is pluggable: set an environment secret DEPLOY_WEBHOOK_URL (Render, Railway,
# Coolify, a custom endpoint...) and an environment variable APP_URL for the post-deploy
# smoke test. Without them the image is still published and the job explains what's missing.
on:
  push:
    branches: [staging, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build & push image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve image name and version
        id: vars
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,prefix=${{ github.ref_name }}-,format=short
            type=raw,value=latest,enable=${{ github.ref_name == 'prod' }}
            type=raw,value=v${{ steps.vars.outputs.version }},enable=${{ github.ref_name == 'prod' }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ""
            echo "\`${{ steps.vars.outputs.image }}@${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "${{ steps.meta.outputs.tags }}" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy (${{ github.ref_name == 'prod' && 'production' || 'staging' }})
    needs: publish
    runs-on: ubuntu-latest
    # Add required reviewers to the "production" environment in
    # Settings -> Environments to get a manual approval gate before prod deploys.
    environment:
      name: ${{ github.ref_name == 'prod' && 'production' || 'staging' }}
      url: ${{ vars.APP_URL }}
    env:
      IMAGE_REF: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Trigger deployment
        run: |
          if [ -z "${DEPLOY_WEBHOOK_URL}" ]; then
            echo "::notice title=No deploy target::Image ${IMAGE_REF} published. Set the DEPLOY_WEBHOOK_URL secret on this environment to deploy automatically."
            exit 0
          fi
          curl -fsS -X POST "${DEPLOY_WEBHOOK_URL}" \
            -H 'content-type: application/json' \
            -d "{\"image\":\"${IMAGE_REF}\",\"environment\":\"${{ github.ref_name }}\",\"sha\":\"${GITHUB_SHA}\"}"
      - name: Post-deploy smoke test
        if: env.APP_URL != ''
        run: ./scripts/smoke_test.sh "${APP_URL}"

  release:
    name: GitHub release
    if: github.ref_name == 'prod'
    needs: [publish, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ needs.publish.outputs.version }}-build.${{ github.run_number }}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes \
            --notes "Image: \`${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}\`"
